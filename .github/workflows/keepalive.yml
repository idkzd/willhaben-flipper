name: keepalive

on:
  schedule:
    # Every 10 minutes — Render free web services spin down after ~15 min
    # without inbound HTTP traffic, so this keeps the bot awake 24/7.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl -fsS -o /dev/null --retry 3 https://willhaben-flipper.onrender.com/
