name: keepalive

on:
  schedule:
    # Backup only. The bot itself pings its own URL every 5 minutes
    # (keep_alive.py), so it normally never sleeps. This workflow just
    # re-wakes the instance if it ever spins down (e.g. right after a deploy).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        # --connect-timeout/--max-time keep a slow cold start from hanging;
        # retries with a delay give the instance time to boot before the next try.
        run: >
          curl -fsS -o /dev/null
          --connect-timeout 15
          --max-time 60
          --retry 4
          --retry-delay 15
          --retry-all-errors
          https://willhaben-flipper.onrender.com/
